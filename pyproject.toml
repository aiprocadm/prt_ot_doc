[tool.poetry]
name = "prt-ot-doc"
version = "0.1.0"
description = "SaaS-платформа генерации документов по ОТ/ПБ/ПромБез/Эко"
authors = [
    "Promtehnosfera",
]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.29.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
celery = "^5.4.0"
redis = "^5.0.3"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
alembic = "^1.13.3"
slowapi = "^0.1.9"
python-multipart = "^0.0.12"
docxtpl = ">=0.17,<0.18"
python-docx = ">=1.1,<1.2"
typer = "^0.9.0"
click = ">=8.1.7,<8.2"
email-validator = "^2.2.0"
boto3 = "^1.35.36"
minio = "^7.2.10"
prometheus-client = "^0.21.0"
aiosqlite = "^0.20.0"
python-magic = "^0.4.27"

[tool.poetry.dependencies.uvicorn]
extras = [
    "standard",
]
version = "^0.30.5"

[tool.poetry.dependencies.python-jose]
extras = [
    "cryptography",
]
version = "^3.3.0"

[tool.poetry.dependencies.passlib]
extras = [
    "argon2",
]
version = "^1.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
coverage = "^7.6.0"
ruff = "^0.6.9"
black = "^24.10.0"
mypy = "^1.11.2"
pyyaml = "^6.0.2"
moto = "^5.0.7"
schemathesis = "^3.28.0"

[tool.poetry.scripts]
app = "app.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
addopts = "-q"
markers = [
    "db: Tests that require a running database with applied migrations",
    "contract: OpenAPI contract validation tests",
]
pythonpath = [
    ".",
]
filterwarnings = [
    'ignore:"crypt" is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils',
    'ignore:json_encoders is deprecated:DeprecationWarning:pydantic._internal._generate_schema',
    'ignore:on_event is deprecated, use lifespan event handlers instead.:DeprecationWarning:fastapi.applications',
    'ignore:datetime.datetime.utcnow() is deprecated and scheduled for removal in a future version.:DeprecationWarning:botocore.auth',
    'ignore:datetime.datetime.utcnow() is deprecated and scheduled for removal in a future version.:DeprecationWarning:jose.jwt',
    'ignore:Accessing argon2.__version__ is deprecated and will be removed in a future release.:DeprecationWarning:passlib.handlers.argon2',
    'ignore:Table.tometadata() is renamed to Table.to_metadata():sqlalchemy.exc.SADeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app/services", "app/schemas"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[build-system]
requires = [
    "poetry-core>=1.9.0",
]
build-backend = "poetry.core.masonry.api"
