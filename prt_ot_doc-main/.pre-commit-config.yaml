repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        additional_dependencies: ["click<8.1.4"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.5
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.2.5
        files: "^frontend/"
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.0
    hooks:
      - id: eslint
        files: "^frontend/src/"
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.34.1
          - @typescript-eslint/parser@7.3.1
          - @typescript-eslint/eslint-plugin@7.3.1
  - repo: local
    hooks:
      - id: no-raw-session-query
        name: ban raw session.query in backend domain code
        entry: python scripts/ci/check_scoped_queries.py
        language: system
        pass_filenames: false
