components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Sort:
      name: sort
      in: query
      schema:
        type: string
        description: Список полей через запятую, пример `name:asc`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PackId:
      name: packId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistId:
      name: checklistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ViolationId:
      name: violationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegisterId:
      name: registerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        trace_id:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
    MeResponse:
      type: object
      required: [sub, email, role]
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        tenant_id:
          anyOf:
            - type: string
            - type: 'null'
        tenant_slug:
          anyOf:
            - type: string
            - type: 'null'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        company_id:
          anyOf:
            - type: string
            - type: 'null'
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        abac_scopes:
          type: object
          additionalProperties:
            anyOf:
              - type: array
                items:
                  type: string
              - type: integer
              - type: 'null'
        abilities:
          type: array
          items:
            type: string
    PermissionsResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        abac_scopes:
          type: object
          additionalProperties:
            anyOf:
              - type: array
                items:
                  type: string
              - type: integer
              - type: 'null'
    Tenant:
      type: object
      required: [id, slug, name, contact_email, settings]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        contact_email:
          type: string
          format: email
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCreate:
      type: object
      required: [slug, name, contact_email]
      properties:
        slug:
          type: string
        name:
          type: string
        contact_email:
          type: string
          format: email
        settings:
          type: object
          additionalProperties: true
    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        contact_email:
          type: string
          format: email
        settings:
          type: object
          additionalProperties: true
    TenantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Feature:
      type: object
      required: [id, code, title]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: string
    FeatureList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
    TenantFeature:
      type: object
      required: [id, tenant_id, feature_id, enabled]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        feature_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    TenantFeatureList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantFeature'
    TenantFeatureUpsert:
