openapi: 3.1.0
info:
  title: PRT OT Platform Backend API
  version: 1.0.0
  description: |
    REST API для платформы автоматизации охраны труда, промышленной, пожарной и экологической безопасности.
servers:
  - url: https://api.example.com
    description: Продакшн
  - url: https://staging.api.example.com
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Аутентификация и сессии
  - name: Tenants
    description: Управление арендаторами и фичами
  - name: Users
    description: Управление пользователями
  - name: Companies
    description: Компании, объекты и сотрудники
  - name: Training
    description: Обучение и допуски
  - name: PPE
    description: СИЗ и склады
  - name: Templates
    description: Шаблоны документов и пакеты
  - name: Documents
    description: Генерация документов и пакетов
  - name: Compliance
    description: Проверки, нарушения, риски и инциденты
  - name: Files
    description: Работа с файлами
  - name: Integrations
    description: Внешние интеграции и webhooks
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход пользователя
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access токена
      operationId: refreshToken
      requestBody:
        required: false
        description: Тело опционально — refresh может передаваться в HttpOnly cookie.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/RefreshRequest'
                - type: 'null'
      responses:
        '200':
          description: Новые токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Завершить сессию
      operationId: logout
      responses:
        '204':
          description: Сессия завершена
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Получить профиль текущего пользователя
      operationId: getCurrentUser
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me/permissions:
    get:
      tags: [Auth]
      summary: Получить effective permissions текущего пользователя
      operationId: getCurrentUserPermissions
      responses:
        '200':
          description: Эффективные роли, права и ABAC-scopes пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: Список арендаторов
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Список арендаторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
    post:
      tags: [Tenants]
      summary: Создать арендатора
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Арендатор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: Получить арендатора
      operationId: getTenant
      responses:
        '200':
          description: Арендатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tenants]
      summary: Обновить арендатора
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Обновлённый арендатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tenants/{tenantId}/features:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: Получить список фич арендатора
      operationId: listTenantFeatures
      responses:
        '200':
          description: Список фич
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFeatureList'
    put:
      tags: [Tenants]
      summary: Включить или отключить фичу
      operationId: upsertTenantFeature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantFeatureUpsert'
      responses:
        '200':
          description: Статус фичи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFeature'
  /api/v1/features:
    get:
      tags: [Tenants]
      summary: Справочник фич
      operationId: listFeatures
      responses:
        '200':
          description: Доступные фичи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureList'
  /api/v1/users:
    get:
      tags: [Users]
      summary: Список пользователей
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      tags: [Users]
      summary: Создать пользователя
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Получить пользователя
      operationId: getUser
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Обновить пользователя
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Деактивировать пользователя
      operationId: deleteUser
      responses:
        '204':
          description: Пользователь деактивирован
  /api/v1/companies:
    get:
      tags: [Companies]
      summary: Список компаний
      operationId: listCompanies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyList'
    post:
      tags: [Companies]
      summary: Создать компанию
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '201':
          description: Компания создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Получить компанию
      operationId: getCompany
      responses:
        '200':
          description: Компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Обновить компанию
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: Обновлённая компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    delete:
      tags: [Companies]
      summary: Архивировать компанию
      operationId: archiveCompany
      responses:
        '204':
          description: Компания архивирована
  /api/v1/sites:
    get:
      tags: [Companies]
      summary: Список объектов
      operationId: listSites
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: company_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Объекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
    post:
      tags: [Companies]
      summary: Создать объект
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
      responses:
        '201':
          description: Объект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
  /api/v1/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Companies]
      summary: Получить объект
      operationId: getSite
      responses:
        '200':
          description: Объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Обновить объект
      operationId: updateSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: Обновлённый объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      tags: [Companies]
      summary: Архивировать объект
      operationId: archiveSite
      responses:
        '204':
          description: Объект архивирован
  /api/v1/positions:
    get:
      tags: [Companies]
      summary: Должности
      operationId: listPositions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: company_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Должности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
    post:
      tags: [Companies]
      summary: Создать должность
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCreate'
      responses:
        '201':
          description: Должность создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
  /api/v1/persons:
    get:
      tags: [Companies]
      summary: Сотрудники
      operationId: listPersons
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: company_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Сотрудники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'
    post:
      tags: [Companies]
      summary: Создать сотрудника
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
      responses:
        '201':
          description: Сотрудник создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
  /api/v1/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Companies]
      summary: Получить сотрудника
      operationId: getPerson
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Обновить сотрудника
      operationId: updatePerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Обновлённый сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
    delete:
      tags: [Companies]
      summary: Деактивировать сотрудника
      operationId: deactivatePerson
      responses:
        '204':
          description: Сотрудник деактивирован
  /api/v1/persons/{personId}/trainings:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Training]
      summary: Обучение сотрудника
      operationId: listTrainings
      responses:
        '200':
          description: Назначения обучения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingAssignmentList'
    post:
      tags: [Training]
      summary: Назначить обучение
      operationId: assignTraining
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingAssignmentCreate'
      responses:
        '201':
          description: Назначение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingAssignment'
  /api/v1/persons/{personId}/medical-exams:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Training]
      summary: Медосмотры
      operationId: listMedicalExams
      responses:
        '200':
          description: Медосмотры сотрудника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalExamList'
    post:
      tags: [Training]
      summary: Добавить медосмотр
      operationId: createMedicalExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalExamCreate'
      responses:
        '201':
          description: Медосмотр создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalExam'
  /api/v1/persons/{personId}/permits:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Training]
      summary: Допуски
      operationId: listPermits
      responses:
        '200':
          description: Допуски
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitList'
    post:
      tags: [Training]
      summary: Выдать допуск
      operationId: createPermit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitCreate'
      responses:
        '201':
          description: Допуск создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permit'
  /api/v1/ppe/norms:
    get:
      tags: [PPE]
      summary: Нормы выдачи
      operationId: listPpeNorms
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: position_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Нормы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeNormList'
    post:
      tags: [PPE]
      summary: Создать норму
      operationId: createPpeNorm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PpeNormCreate'
      responses:
        '201':
          description: Норма создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeNorm'
  /api/v1/ppe/stocks:
    get:
      tags: [PPE]
      summary: Складские остатки
      operationId: listPpeStocks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: location
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Остатки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeStockList'
    post:
      tags: [PPE]
      summary: Обновить остаток
      operationId: upsertPpeStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PpeStockUpsert'
      responses:
        '200':
          description: Остаток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeStock'
  /api/v1/ppe/issues:
    get:
      tags: [PPE]
      summary: Выдачи СИЗ
      operationId: listPpeIssues
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: person_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Выдачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeIssueList'
    post:
      tags: [PPE]
      summary: Выдать СИЗ
      operationId: createPpeIssue
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PpeIssueCreate'
      responses:
        '201':
          description: Выдача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PpeIssue'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/templates:
    get:
      tags: [Templates]
      summary: Список шаблонов
      operationId: listTemplates
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Шаблоны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
    post:
      tags: [Templates]
      summary: Создать шаблон
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /api/v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Templates]
      summary: Получить шаблон
      operationId: getTemplate
      responses:
        '200':
          description: Шаблон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Templates]
      summary: Обновить шаблон
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdate'
      responses:
        '200':
          description: Обновлённый шаблон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
    delete:
      tags: [Templates]
      summary: Архивировать шаблон
      operationId: archiveTemplate
      responses:
        '204':
          description: Шаблон архивирован
  /api/v1/templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Templates]
      summary: Версии шаблона
      operationId: listTemplateVersions
      responses:
        '200':
          description: Версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersionList'
    post:
      tags: [Templates]
      summary: Добавить версию шаблона
      operationId: createTemplateVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateVersionCreate'
      responses:
        '201':
          description: Версия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
  /api/v1/document-packs:
    get:
      tags: [Templates]
      summary: Пакеты документов
      operationId: listDocumentPacks
      responses:
        '200':
          description: Пакеты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPackList'
    post:
      tags: [Templates]
      summary: Создать пакет документов
      operationId: createDocumentPack
      requestBody:
        required: true
