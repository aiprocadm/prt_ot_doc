# Security exceptions are temporary risk acceptances.
# Required fields for every record:
# - id: finding identifier (CVE/GHSA/etc.)
# - tool: scanner that emits the finding (trivy, gitleaks, bandit, ...)
# - category: vulnerability | secret | sast | container
# - owner: team or person accountable for remediation
# - reason: business/technical reason the exception is needed
# - expires_on: YYYY-MM-DD (CI rejects expired entries)
# Optional fields: created_on, scope.paths, ticket
exceptions:
  - id: CVE-2025-62727
    tool: trivy
    category: container
    owner: reviewers-platform-infra
    reason: >-
      Starlette DoS via Range header merging. Fixed at starlette 0.49.1, but
      fastapi 0.115.4 (current pin) restricts starlette to <0.42.0. Bumping
      fastapi cross-cuts the entire backend and is scheduled as a separate
      hardening PR; in the meantime our edge proxy enforces Range header
      validation, neutralising the practical exploit path.
    expires_on: 2026-08-31
    created_on: 2026-05-21
    scope:
      paths:
        - "**/starlette*"

  # --- pip-audit (разд. 64.1): остаток после подъёма зависимостей 2026-07-30. ---
  # Каждая запись ниже скармливается шагу pip-audit как --ignore-vuln через
  # scripts/ci/render_pip_audit_ignores.py; просроченные записи валит
  # check_security_exceptions.py, поэтому «вечных» исключений не бывает.

  # starlette 0.41.3 — весь блок ждёт отдельного PR подъёма fastapi/starlette:
  # fastapi 0.115.4 ограничивает starlette <0.42.0, а починки начинаются с 0.47.2.
  # То же обоснование, что у trivy-записи CVE-2025-62727 выше.
  - id: PYSEC-2026-161
    tool: pip-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      starlette 0.41.3: fix requires starlette >=1.0.1, blocked by fastapi
      0.115.4 pin (<0.42.0). Scheduled as a dedicated fastapi/starlette bump PR
      with a full test-suite and db-gate run (docs/security/DEPENDENCY_AUDIT.md).
    expires_on: 2026-08-31
    created_on: 2026-07-30
