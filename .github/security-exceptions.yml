# Security exceptions are temporary risk acceptances.
# Required fields for every record:
# - id: finding identifier (CVE/GHSA/etc.)
# - tool: scanner that emits the finding (trivy, gitleaks, bandit, ...)
# - category: vulnerability | secret | sast | container
# - owner: team or person accountable for remediation
# - reason: business/technical reason the exception is needed
# - expires_on: YYYY-MM-DD (CI rejects expired entries)
# Optional fields: created_on, scope.paths, ticket
exceptions:
  # --- trivy (container-image-scan): base-image/toolchain, не зависимости приложения. ---

  - id: GHSA-6v7p-g79w-8964
    tool: trivy
    category: container
    owner: reviewers-platform-infra
    reason: >-
      msgpack 1.1.2 в образе — это НЕ зависимость приложения (requirements
      пинит msgpack==1.2.1, где GHSA закрыт), а копия, вендоренная внутри pip
      (pip/_vendor/msgpack): даже новейший pip 26.1.2 несёт 1.1.2, апгрейд pip
      не помогает. Код недостижим в рантайме приложения (pip в проде не
      вызывается). Re-review: снять после релиза pip с msgpack>=1.2.1.
    expires_on: 2026-11-30
    created_on: 2026-08-06

  - id: CVE-2025-47273
    tool: trivy
    category: container
    owner: reviewers-platform-infra
    reason: >-
      setuptools 70.3.0 — фантом из манифеста вендоренных компонентов pip
      (pip/_vendor/vendor.txt + bom.cdx.json): файлов setuptools-70.3.0 в
      образе нет (проверено find по живому образу), реальный setuptools в
      site-packages поднят Dockerfile'ом до 83.0.0. Уязвимый код (PackageIndex)
      в рантайме приложения недостижим. Re-review: снять после релиза pip с
      setuptools>=78.1.1 в vendor.txt.
    expires_on: 2026-11-30
    created_on: 2026-08-06

  # --- pip-audit (разд. 64.1): остаток после подъёма зависимостей. ---
  # Записи скармливаются шагу pip-audit как --ignore-vuln через
  # scripts/ci/render_pip_audit_ignores.py. (2026-07-31: блок starlette ×7 и
  # trivy CVE-2025-62727 сняты — fastapi 0.141.1 / starlette 1.3.1 подняты,
  # advisories закрыты по существу.)

  - id: PYSEC-2026-1325
    tool: pip-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      ecdsa 0.19.2 (transitive via python-jose): Minerva timing attack, upstream
      declares side-channel resistance out of scope — no fixed release exists to
      upgrade to. JWT signing here uses RSA keys (python-jose[cryptography]),
      not the pure-python ecdsa path. Re-review: replace python-jose or drop the
      ecdsa extra.
    expires_on: 2026-10-31
    created_on: 2026-07-30

  - id: PYSEC-2026-1845
    tool: pip-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      pytest 8.3.3 (dev-only, never shipped): fix is pytest 9.x — a major bump
      that drags pytest-asyncio/cov/timeout/xdist compat and needs its own PR
      with a full suite run.
    expires_on: 2026-09-30
    created_on: 2026-07-30

  - id: PYSEC-2026-2120
    tool: pip-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      black 24.10.0 (dev-only, never shipped): fix is black 26.x whose default
      style differs — bumping means reformatting the codebase in a dedicated PR
      (make lint uses black --check).
    expires_on: 2026-09-30
    created_on: 2026-07-30
  - id: PYSEC-2026-2121
    tool: pip-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      black 24.10.0 (dev-only, never shipped): same dedicated-reformat-PR
      blocker as PYSEC-2026-2120.
    expires_on: 2026-09-30
    created_on: 2026-07-30

  # --- npm-audit (разд. 64.1): остаток после `npm audit fix` 2026-07-31. ---
  # Записи читает scripts/ci/check_npm_audit.py (гейт по КОРНЕВЫМ advisory:
  # одна дыра minimatch красит у npm десятки пакетов транзитивно, поэтому
  # исключения ведутся по GHSA первопричины, а не по пакетам). Все шесть —
  # dev-инструменты (в собранный фронт не попадают); починки только мажорными
  # бампами, каждый — отдельный PR с прогоном фронт-гейтов.

  - id: GHSA-5xrq-8626-4rwp
    tool: npm-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      vitest 1.x (critical, dev-only test runner, never shipped): arbitrary
      file read/execute applies only when the Vitest UI dev server is
      listening — CI runs headless `vitest run`, no UI server. Fix is vitest
      4.x + @vitest/coverage-v8 4.x, a major bump of the whole test toolchain
      (603 frontend tests) in a dedicated PR.
    expires_on: 2026-09-30
    created_on: 2026-07-31
  - id: GHSA-fx2h-pf6j-xcff
    tool: npm-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      vite 5.x (dev server only, never shipped): server.fs.deny bypass via
      Windows alternate paths — dev machines here run Linux/WSL and the dev
      server is not exposed. Fix is vite 8.x, a major build-toolchain bump in
      a dedicated PR.
    expires_on: 2026-09-30
    created_on: 2026-07-31
  - id: GHSA-3ppc-4f35-3m26
    tool: npm-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      minimatch ReDoS (transitive, dev-only lint/build tooling): needs
      attacker-controlled patterns, ours are static. Cleared by the
      eslint-toolchain major bump in a dedicated PR.
    expires_on: 2026-09-30
    created_on: 2026-07-31
  - id: GHSA-7r86-cg39-jmmj
    tool: npm-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      minimatch ReDoS (transitive, dev-only): same eslint-toolchain-bump
      blocker as GHSA-3ppc-4f35-3m26.
    expires_on: 2026-09-30
    created_on: 2026-07-31
  - id: GHSA-23c5-xmqv-rm74
    tool: npm-audit
    category: vulnerability
    owner: reviewers-platform-infra
    reason: >-
      minimatch ReDoS (transitive, dev-only): same eslint-toolchain-bump
      blocker as GHSA-3ppc-4f35-3m26.
    expires_on: 2026-09-30
    created_on: 2026-07-31
