# Security exceptions are temporary risk acceptances.
# Required fields for every record:
# - id: finding identifier (CVE/GHSA/etc.)
# - tool: scanner that emits the finding (trivy, gitleaks, bandit, ...)
# - category: vulnerability | secret | sast | container
# - owner: team or person accountable for remediation
# - reason: business/technical reason the exception is needed
# - expires_on: YYYY-MM-DD (CI rejects expired entries)
# Optional fields: created_on, scope.paths, ticket
exceptions:
  - id: CVE-2025-62727
    tool: trivy
    category: container
    owner: reviewers-platform-infra
    reason: >-
      Starlette DoS via Range header merging. Fixed at starlette 0.49.1, but
      fastapi 0.115.4 (current pin) restricts starlette to <0.42.0. Bumping
      fastapi cross-cuts the entire backend and is scheduled as a separate
      hardening PR; in the meantime our edge proxy enforces Range header
      validation, neutralising the practical exploit path.
    expires_on: 2026-08-31
    created_on: 2026-05-21
    scope:
      paths:
        - "**/starlette*"
