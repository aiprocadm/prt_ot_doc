name: Final Acceptance

# Produces the `artifacts/final_acceptance/summary.json` evidence bundle that
# RB-003 / RC-004 require. Manual trigger only — the underlying script
# (`scripts/final_acceptance.sh`) runs ~10 minutes of integration tests plus
# a frontend build, and we only need a green artifact ahead of a release
# verdict, not on every push.

on:
  workflow_dispatch:

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install LibreOffice (PDF subsystem health check)
        run: sudo apt-get update && sudo apt-get install -y libreoffice-core

      - name: Run final acceptance bundle
        run: make final-acceptance

      - name: Upload final acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-acceptance-evidence
          path: |
            artifacts/final_acceptance/
          if-no-files-found: warn
          retention-days: 30
