name: DAST (OWASP ZAP)

# Разд. 69.1: «DAST (динамика) — НЕТ → Добавить базовый (OWASP ZAP) на стенде».
#
# Почему НЕ на каждый PR: скан поднимает приложение и обходит 900+ операций —
# это минуты, а находки повторяются от прогона к прогону. По расписанию + по
# кнопке даёт ту же информацию, не удлиняя цикл разработки.
#
# Почему OBSERVE-MODE (fail_action: false): базовый прогон на живом API всегда
# даёт шум (информационные предупреждения ZAP), и блокирующий гейт на старте
# означал бы красный пайплайн и последующее отключение проверки — тот же довод,
# по которому в repo уже поэтапно вводились semgrep и pip-audit. Порядок перевода
# в блокирующий — docs/security/DAST.md.
on:
  workflow_dispatch:
  schedule:
    # Понедельник, 03:00 UTC — до начала рабочей недели.
    - cron: "0 3 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  zap-api-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Спецификация берётся из объекта приложения, а не с живой ручки: в проде
      # документация отключена намеренно, а /api/openapi.json ещё и требует
      # X-Tenant — сканер не получил бы список эндпоинтов до аутентификации.
      - name: Dump OpenAPI specification
        run: PYTHONPATH=backend python scripts/ci/dump_openapi.py --output openapi.json

      - name: Start backend (dockerless, SQLite)
        run: |
          PYTHONPATH=backend python scripts/run_backend_lite.py > /tmp/dast-backend.log 2>&1 &
          echo $! > /tmp/dast-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start" >&2
          tail -n 200 /tmp/dast-backend.log || true
          exit 1

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: openapi.json
          format: openapi
          # Спецификация лежит файлом, а запросы уходят на живое приложение.
          cmd_options: "-O http://127.0.0.1:8000 -z '-config replacer.full_list(0).description=tenant -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=X-Tenant -config replacer.full_list(0).replacement=demo'"
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false

      - name: Collect backend log
        if: always()
        run: tail -n 500 /tmp/dast-backend.log > dast-backend.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md
            dast-backend.log
          if-no-files-found: warn
          retention-days: 30
