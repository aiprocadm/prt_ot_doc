name: Perf Baseline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Fill required CI secrets (placeholders only)
        # Staging-hardening (backend/app/core/config.py::bootstrap) rejects empty
        # SECRET_KEY / S3_ACCESS_KEY / S3_SECRET_KEY. .env.example ships them
        # blank by design — fill with CI-only placeholders so API can boot.
        #
        # iter-27 (RB-002 perf-auth): ADMIN_PASSWORD enables bootstrap_admin_user
        # (backend/app/services/dev_bootstrap.py) so api_load.py --login-email can
        # exchange creds for a JWT. .env.example ships ADMIN_BOOTSTRAP=1 and
        # ADMIN_EMAIL=admin@example.com but ADMIN_PASSWORD blank — without the
        # password, no admin row is seeded, every /api/v1/* probe returns 401,
        # and threshold_check=FAIL on the dashboard scenario.
        run: |
          cat >> .env <<'EOF'
          SECRET_KEY=ci-perf-baseline-not-for-production
          POSTGRES_PASSWORD=ptd
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          APP_DB_PASSWORD=ci-ptd-app-not-for-production
          ADMIN_PASSWORD=PerfBaseline123!
          EOF
          # DATABASE_URL в .env.example содержит пароль-заглушку CHANGE_ME —
          # роль же создаётся initdb с APP_DB_PASSWORD; синхронизируем.
          sed -i 's|ptd_app:CHANGE_ME|ptd_app:ci-ptd-app-not-for-production|' .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API ready after ${i} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready within 600s"
          docker compose logs --tail=200 api
          exit 1

      - name: Run nightly baseline profile
        # iter-27 (RB-002 perf-auth): PERF_LOGIN_EMAIL / PERF_LOGIN_PASSWORD
        # must match ADMIN_EMAIL / ADMIN_PASSWORD seeded into the API container
        # via .env above. The orchestrator below appends --login-email /
        # --login-password to every api_load.py call so the script can exchange
        # creds for a JWT before the load loop and inject Authorization: Bearer
        # into all probes.
        env:
          PERF_LOGIN_EMAIL: admin@example.com
          PERF_LOGIN_PASSWORD: PerfBaseline123!
        run: |
          mkdir -p artifacts/perf/nightly
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          login_email = os.environ.get("PERF_LOGIN_EMAIL")
          login_password = os.environ.get("PERF_LOGIN_PASSWORD")

          scenarios = json.loads(Path("scripts/perf/scenarios.json").read_text())
          profile = scenarios["profiles"]["nightly_baseline"]
          for scenario in profile:
              out = Path("artifacts/perf/nightly") / f"{scenario['name']}.json"
              cmd = [
                  "python",
                  "scripts/perf/api_load.py",
                  "--base-url",
                  "http://localhost:8000",
                  "--path",
                  scenario["path"],
                  "--requests",
                  str(scenario["requests"]),
                  "--concurrency",
                  str(scenario["concurrency"]),
                  "--expect-status",
                  str(scenario.get("expect_status", 200)),
                  "--output-json",
                  str(out),
              ]
              if scenario.get("tenant"):
                  cmd.extend(["--tenant", scenario["tenant"]])
              if scenario.get("method") and scenario["method"] != "FLOW":
                  cmd.extend(["--method", scenario["method"]])
              if scenario.get("headers"):
                  cmd.extend(["--headers-json", json.dumps(scenario["headers"])])
              if scenario.get("body"):
                  cmd.extend(["--body-json", json.dumps(scenario["body"])])
              if scenario.get("flow_steps"):
                  cmd.extend(["--flow-json", json.dumps(scenario["flow_steps"])])
              # Inject auth ONLY when this profile run has credentials. /health
              # ignores the Authorization header so adding it globally is safe.
              if login_email and login_password:
                  cmd.extend([
                      "--login-email", login_email,
                      "--login-password", login_password,
                  ])
              print("::group::" + scenario["name"])
              # Mask password in the echoed command line — argparse still parses
              # the real value from cmd[].
              printable_cmd = list(cmd)
              if "--login-password" in printable_cmd:
                  idx = printable_cmd.index("--login-password") + 1
                  if idx < len(printable_cmd):
                      printable_cmd[idx] = "***"
              print(" ".join(printable_cmd))
              subprocess.run(cmd, check=True)
              print("::endgroup::")
          PY

      - name: Build trend manifest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('artifacts/perf/nightly')
          results = []
          for path in sorted(root.glob('*.json')):
            payload = json.loads(path.read_text())
            results.append(payload)

          manifest = {
            'generated_at_utc': datetime.now(timezone.utc).isoformat(),
            'profile': 'nightly_baseline',
            'results': results,
          }
          (root / 'trend-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          rows = []
          for result in results:
            rows.append(
              {
                "path": result["path"],
                "p50_ms": round(float(result["p50_ms"]), 2),
                "p95_ms": round(float(result["p95_ms"]), 2),
                "p99_ms": round(float(result["p99_ms"]), 2),
                "error_rate": round(float(result["error_rate"]), 6),
                "throughput_rps": round(float(result["throughput_rps"]), 2),
              }
            )
          headers = ["path", "p50_ms", "p95_ms", "p99_ms", "error_rate", "throughput_rps"]
          markdown = [
            "| path | p50_ms | p95_ms | p99_ms | error_rate | throughput_rps |",
            "|---|---:|---:|---:|---:|---:|",
          ]
          csv = [",".join(headers)]
          for row in rows:
            markdown.append(
              f"| {row['path']} | {row['p50_ms']} | {row['p95_ms']} | {row['p99_ms']} | {row['error_rate']} | {row['throughput_rps']} |"
            )
            csv.append(",".join(str(row[k]) for k in headers))
          (root / "summary.md").write_text("\n".join(markdown) + "\n")
          (root / "summary.csv").write_text("\n".join(csv) + "\n")
          PY

      - name: Upload perf baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ github.run_id }}
          path: artifacts/perf/nightly/*

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > perf-baseline-logs.txt

      - name: Upload perf baseline logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-logs
          path: perf-baseline-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
