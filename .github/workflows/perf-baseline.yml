name: Perf Baseline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Run nightly baseline profile
        run: |
          mkdir -p artifacts/perf/nightly
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          scenarios = json.loads(Path("scripts/perf/scenarios.json").read_text())
          profile = scenarios["profiles"]["nightly_baseline"]
          for scenario in profile:
              out = Path("artifacts/perf/nightly") / f"{scenario['name']}.json"
              cmd = [
                  "python",
                  "scripts/perf/api_load.py",
                  "--base-url",
                  "http://localhost:8000",
                  "--path",
                  scenario["path"],
                  "--requests",
                  str(scenario["requests"]),
                  "--concurrency",
                  str(scenario["concurrency"]),
                  "--expect-status",
                  str(scenario.get("expect_status", 200)),
                  "--output-json",
                  str(out),
              ]
              if scenario.get("tenant"):
                  cmd.extend(["--tenant", scenario["tenant"]])
              if scenario.get("method") and scenario["method"] != "FLOW":
                  cmd.extend(["--method", scenario["method"]])
              if scenario.get("headers"):
                  cmd.extend(["--headers-json", json.dumps(scenario["headers"])])
              if scenario.get("body"):
                  cmd.extend(["--body-json", json.dumps(scenario["body"])])
              if scenario.get("flow_steps"):
                  cmd.extend(["--flow-json", json.dumps(scenario["flow_steps"])])
              print("::group::" + scenario["name"])
              print(" ".join(cmd))
              subprocess.run(cmd, check=True)
              print("::endgroup::")
          PY

      - name: Build trend manifest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('artifacts/perf/nightly')
          results = []
          for path in sorted(root.glob('*.json')):
            payload = json.loads(path.read_text())
            results.append(payload)

          manifest = {
            'generated_at_utc': datetime.now(timezone.utc).isoformat(),
            'profile': 'nightly_baseline',
            'results': results,
          }
          (root / 'trend-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          rows = []
          for result in results:
            rows.append(
              {
                "path": result["path"],
                "p50_ms": round(float(result["p50_ms"]), 2),
                "p95_ms": round(float(result["p95_ms"]), 2),
                "p99_ms": round(float(result["p99_ms"]), 2),
                "error_rate": round(float(result["error_rate"]), 6),
                "throughput_rps": round(float(result["throughput_rps"]), 2),
              }
            )
          headers = ["path", "p50_ms", "p95_ms", "p99_ms", "error_rate", "throughput_rps"]
          markdown = [
            "| path | p50_ms | p95_ms | p99_ms | error_rate | throughput_rps |",
            "|---|---:|---:|---:|---:|---:|",
          ]
          csv = [",".join(headers)]
          for row in rows:
            markdown.append(
              f"| {row['path']} | {row['p50_ms']} | {row['p95_ms']} | {row['p99_ms']} | {row['error_rate']} | {row['throughput_rps']} |"
            )
            csv.append(",".join(str(row[k]) for k in headers))
          (root / "summary.md").write_text("\n".join(markdown) + "\n")
          (root / "summary.csv").write_text("\n".join(csv) + "\n")
          PY

      - name: Upload perf baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ github.run_id }}
          path: artifacts/perf/nightly/*

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > perf-baseline-logs.txt

      - name: Upload perf baseline logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-logs
          path: perf-baseline-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
