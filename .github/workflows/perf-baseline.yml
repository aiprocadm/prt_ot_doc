name: Perf Baseline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Run nightly baseline profile
        run: |
          mkdir -p artifacts/perf/nightly

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /health \
            --requests 200 \
            --concurrency 20 \
            --expect-status 200 \
            --output-json artifacts/perf/nightly/health.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/dashboard/summary \
            --tenant demo \
            --requests 180 \
            --concurrency 18 \
            --expect-status 200 \
            --output-json artifacts/perf/nightly/dashboard.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/templates \
            --tenant demo \
            --requests 180 \
            --concurrency 18 \
            --expect-status 200 \
            --output-json artifacts/perf/nightly/templates.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path '/api/v1/search/suggest?q=doc' \
            --tenant demo \
            --requests 180 \
            --concurrency 18 \
            --expect-status 200 \
            --output-json artifacts/perf/nightly/search.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/files \
            --tenant demo \
            --requests 120 \
            --concurrency 12 \
            --expect-status 200 \
            --output-json artifacts/perf/nightly/files.json

      - name: Build trend manifest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('artifacts/perf/nightly')
          results = []
          for path in sorted(root.glob('*.json')):
            payload = json.loads(path.read_text())
            results.append(payload)

          manifest = {
            'generated_at_utc': datetime.now(timezone.utc).isoformat(),
            'profile': 'nightly_baseline',
            'results': results,
          }
          (root / 'trend-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload perf baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ github.run_id }}
          path: artifacts/perf/nightly/*

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > perf-baseline-logs.txt

      - name: Upload perf baseline logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-logs
          path: perf-baseline-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
