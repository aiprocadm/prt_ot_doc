name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  startup-cross-platform:
    name: Startup Preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-platform launcher preflight
        if: runner.os != 'Windows'
        run: python ./scripts/dev_lite.py --preflight-only --auto-kill-ports

      - name: Cross-platform launcher preflight (Windows)
        if: runner.os == 'Windows'
        run: py -3 .\scripts\dev_lite.py --preflight-only --auto-kill-ports

      - name: Unix shell wrapper preflight
        if: runner.os != 'Windows'
        run: bash ./scripts/dev_lite.sh --preflight-only

      - name: PowerShell wrapper preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\dev_lite.ps1 -PreflightOnly -AutoKillPorts

  security-exceptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate security exception registry
        run: python scripts/ci/check_security_exceptions.py --exceptions-file .github/security-exceptions.yml

  lint-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Scoped query guard
        run: python scripts/ci/check_scoped_queries.py

      - name: Runtime/build artifact guard
        run: python scripts/ci/check_runtime_artifacts.py

      - name: Default secret guard
        run: python scripts/ci/check_default_secrets.py

      - name: Workflow Python version guard
        run: python scripts/ci/check_workflow_python_version.py

      - name: TZ coverage matrix validator
        run: python scripts/audit/check_tz_coverage_matrix.py

      - name: Ruff undefined names + staged mypy (tenant guard)
        run: bash scripts/ci/static_gates.sh

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Render Trivy ignore file from security exceptions
        run: python scripts/ci/render_trivyignore.py --exceptions-file .github/security-exceptions.yml --output .trivyignore.generated

      - name: Dependency vulnerability gate (High/Critical)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          ignore-file: .trivyignore.generated
          format: table
          exit-code: 1

  secret-scan:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning gate
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_EXTRA_ARGS: --redact --verbose --no-git

  sast-static-analysis:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Bandit SAST gate (High severity / High confidence)
        run: |
          mkdir -p artifacts/security
          bandit -r backend/app -lll -iii -f json -o artifacts/security/bandit-high.json

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit-report
          path: artifacts/security/bandit-high.json

  container-image-scan:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency for Trivy ignore rendering
        run: python -m pip install --upgrade pip && python -m pip install pyyaml

      - name: Render Trivy ignore file from security exceptions
        run: python scripts/ci/render_trivyignore.py --exceptions-file .github/security-exceptions.yml --output .trivyignore.generated

      - name: Build API image for scanning
        run: docker build -f Dockerfile -t ptd-api:ci .

      - name: Container image vulnerability gate (High/Critical)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ptd-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          ignore-file: .trivyignore.generated
          format: table
          exit-code: 1

  sbom-generation:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for SBOM
        run: docker build -f Dockerfile -t ptd-api:sbom .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ptd-api:sbom
          format: cyclonedx-json
          output-file: artifacts/security/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/security/sbom.cdx.json

  # Полный прогон миграций на PostgreSQL (asyncpg); ловит ошибки, которые SQLite/heads не видят.
  alembic-postgres-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ptd
          POSTGRES_PASSWORD: ptd
          POSTGRES_DB: ptd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptd -d ptd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+asyncpg://ptd:ptd@localhost:5432/ptd
      REDIS_URL: memory://
      REDIS_RESULT_URL: memory://
      RATE_LIMIT_STORAGE_URI: memory://
      SECRET_KEY: ci-alembic-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic upgrade head on PostgreSQL
        run: alembic -c backend/app/migrations/alembic.ini upgrade head

      - name: Alembic upgrade head again (idempotency)
        run: alembic -c backend/app/migrations/alembic.ini upgrade head

  backend-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REDIS_URL: memory://
      REDIS_RESULT_URL: cache+memory://
      RATE_LIMIT_STORAGE_URI: memory://
      S3_ENDPOINT: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DB_URL: sqlite:///./ci-alembic.db
        run: alembic -c backend/app/migrations/alembic.ini heads

      - name: Backend test suite with coverage
        run: |
          mkdir -p artifacts
          pytest \
            --junitxml=artifacts/backend-junit.xml \
            --cov=backend/app \
            --cov-branch \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=json:artifacts/coverage.json \
            --cov-report=term-missing:skip-covered

      - name: Export term-missing coverage report
        if: always()
        run: python -m coverage report -m > artifacts/coverage-term-missing.txt

      - name: Enforce backend coverage baseline
        run: python scripts/ci/check_backend_coverage_baseline.py --coverage-json artifacts/coverage.json --baseline docs/stabilization/backend_coverage_baseline.json

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            artifacts/backend-junit.xml
            artifacts/coverage.xml
            artifacts/coverage.json
            artifacts/coverage-term-missing.txt

  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Contract suite (docs/openapi.yaml + marked tests)
        env:
          APP_ENV: test
          LIBREOFFICE_BIN: python
        run: pytest tests/contract -m contract -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend CI checks
        run: npm --prefix frontend run ci

      - name: Frontend critical coverage gate
        run: npm --prefix frontend run test:coverage:critical

  smoke-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Prepare env
        run: cp .env.example .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Smoke checks
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > smoke-logs.txt

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v


  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Perf smoke gate (deterministic profiles)
        run: |
          mkdir -p artifacts/perf
          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /health \
            --requests 80 \
            --concurrency 16 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 30 \
            --max-p95-ms 250 \
            --max-p99-ms 600 \
            --output-json artifacts/perf/health-smoke.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/dashboard/summary \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 15 \
            --max-p95-ms 600 \
            --max-p99-ms 1200 \
            --output-json artifacts/perf/dashboard-smoke.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/templates \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 18 \
            --max-p95-ms 500 \
            --max-p99-ms 1000 \
            --output-json artifacts/perf/templates-smoke.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path '/api/v1/search/suggest?q=doc' \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 18 \
            --max-p95-ms 450 \
            --max-p99-ms 900 \
            --output-json artifacts/perf/search-smoke.json

      - name: Upload perf smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-report
          path: artifacts/perf/*.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > perf-smoke-logs.txt

      - name: Upload perf logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-logs
          path: perf-smoke-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
