name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REDIS_URL: memory://
      REDIS_RESULT_URL: cache+memory://
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Scoped query guard
        run: python scripts/ci/check_scoped_queries.py

      - name: Backend test suite
        run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend CI checks
        run: npm --prefix frontend run ci
