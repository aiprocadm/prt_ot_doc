name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  lint-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Scoped query guard
        run: python scripts/ci/check_scoped_queries.py

      - name: Runtime/build artifact guard
        run: python scripts/ci/check_runtime_artifacts.py

  backend-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REDIS_URL: memory://
      REDIS_RESULT_URL: cache+memory://
      RATE_LIMIT_STORAGE_URI: memory://
      S3_ENDPOINT: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DB_URL: sqlite:///./ci-alembic.db
        run: alembic -c backend/app/migrations/alembic.ini heads

      - name: Backend test suite
        run: pytest --junitxml=artifacts/backend-junit.xml

      - name: Upload backend test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: artifacts/backend-junit.xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend CI checks
        run: npm --prefix frontend run ci

  smoke-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Prepare env
        run: cp .env.example .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Smoke checks
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > smoke-logs.txt

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
