name: CI

on:
  workflow_dispatch:
  # ПОЛНЫЙ прогон раз в неделю (понедельник, 02:00 UTC). Он же — страховка от
  # того, что быстрый гейт PR чего-то не поймал: девять осколков бэкенда,
  # macOS/Windows, медленные сканеры безопасности гоняются здесь.
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: ["main", "work"]
    # Правки только документации не меняют поведение кода. Полный прогон
    # стоит ~150 оплачиваемых минут, и платить их за строку в CHANGELOG
    # незачем. Списки намеренно узкие: любой .py/.ts/.yml запускает CI.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

# Новый пуш в ту же ветку отменяет предыдущий прогон. Раньше три коммита
# подряд означали три полных прогона (~450 оплачиваемых минут), хотя ответ
# нужен только по последнему. На main отмену НЕ включаем: там каждый коммит —
# отдельная точка интеграции, и её результат нужен целиком.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Что изменилось в этом PR. Фронтовый PR не должен оплачивать 105 минут
  # бэкендных тестов, и наоборот. Считаем сами, без сторонних действий:
  # лишняя зависимость в CI — это ещё и лишняя поверхность доверия.
  #
  # Здесь же считается `full` — «это полный прогон?». ЗАМЕР (13.08.2026,
  # длительность каждого задания × тариф ОС; timing-эндпоинт GitHub отдаёт нули):
  # прогон на PR — 140 оплачиваемых минут, на main — 160, то есть один влитый
  # срез стоил ~300 минут за ОДИН И ТОТ ЖЕ код. При темпе «несколько срезов в
  # день» бесплатная квота кончалась за неделю, что и произошло 12.08.
  #
  # Поэтому: PR проверяется полностью (это настоящий гейт), а push в main
  # ПОВТОРНО те же тесты не гоняет — они только что прошли на этом же дереве.
  # Полный прогон на main остаётся по расписанию раз в неделю и по кнопке.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      # Полный прогон: расписание, ручной запуск и любой PR. Push в main —
      # НЕ полный: там дерево уже проверено прогоном PR.
      #
      # ЕСЛИ НУЖНО УЖАТЬСЯ СИЛЬНЕЕ (не влезаем в бесплатную квоту) — заменить
      # строку ниже на:
      #   full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Тогда бэкенд-тесты уйдут с PR в еженедельный прогон: срез станет стоить
      # ~35 минут вместо ~155, месяц — около 1000 минут вместо 3800. Это СМЕНА
      # ПОЛИТИКИ гейта, а не оптимизация: PR перестанет проверяться тестами в
      # CI. Она допустима ровно потому, что канон проекта — local-evidence
      # (docs/stabilization/RELEASE_BLOCKERS_STATUS.md): доказательство волны —
      # локальный полный прогон + db-гейт, приложенные к телу PR. Решение о
      # смене политики — за владельцем, поэтому по умолчанию оставлено «PR
      # проверяется полностью».
      full: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Пуш новой ветки/форс-пуш даёт нулевой base — считаем, что задето всё.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "База недоступна ($base) — гоняем всё."
            exit 0
          fi
          files=$(git diff --name-only "$base" "$head")
          echo "$files"
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          # Всё, что не фронт и не документация, считаем бэкендом: ошибиться
          # в сторону «прогнать лишнее» дешевле, чем пропустить регресс.
          echo "backend=$(match '^(backend/|tests/|integration_tests/|scripts/|alembic|pyproject\.toml|requirements.*\.txt|app/|Makefile|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(match '^(frontend/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "infra=$(match '^(infra/|docker|Dockerfile|compose|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  startup-cross-platform:
    name: Startup Preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # macOS оплачивается по десятикратному тарифу, Windows — по двойному, а
      # минимальная единица списания — минута. ЗАМЕР: эта проверка отработала
      # на macOS за 15 СЕКУНД и стоила 10 оплачиваемых минут, на Windows — 29
      # секунд и 2 минуты. То есть кросс-платформенный дым обходился в 12 минут
      # на КАЖДЫЙ пуш в main — больше, чем весь фронтенд с тестами.
      #
      # Теперь macOS и Windows гоняются только в ПОЛНОМ прогоне (еженедельно и
      # по кнопке). Linux — всегда: он ловит подавляющее большинство поломок
      # запуска, и он же бесплатнее всех.
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-platform launcher preflight
        if: runner.os != 'Windows'
        run: python ./scripts/dev_lite.py --preflight-only --auto-kill-ports

      - name: Cross-platform launcher preflight (Windows)
        if: runner.os == 'Windows'
        run: py -3 .\scripts\dev_lite.py --preflight-only --auto-kill-ports

      - name: Unix shell wrapper preflight
        if: runner.os != 'Windows'
        run: bash ./scripts/dev_lite.sh --preflight-only

      - name: PowerShell wrapper preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\dev_lite.ps1 -PreflightOnly -AutoKillPorts

  security-exceptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate security exception registry
        run: python scripts/ci/check_security_exceptions.py --exceptions-file .github/security-exceptions.yml

      # SEC-69 разд. 69.3 (срез-183): «седьмой вопрос» стал гейтом. Спрашивает
      # только там, где изменения трогают поверхности атаки; на PR без них молчит.
      - name: Security DoD (седьмой вопрос)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          PYTHONPATH=backend python scripts/ci/check_security_dod.py --base "origin/${{ github.base_ref }}"

  lint-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      # LibreOffice не нужен ни одному гарду ниже: они читают код и схему.
      # Проверено запуском всех гардов на машине без установленного пакета.

      - name: Scoped query guard
        run: python scripts/ci/check_scoped_queries.py

      - name: Runtime/build artifact guard
        run: python scripts/ci/check_runtime_artifacts.py

      - name: Default secret guard
        run: python scripts/ci/check_default_secrets.py

      - name: Workflow Python version guard
        run: python scripts/ci/check_workflow_python_version.py

      - name: TZ coverage matrix validator
        run: python scripts/audit/check_tz_coverage_matrix.py

      - name: RLS coverage ratchet (SEC-65)
        run: PYTHONPATH=backend python scripts/audit/check_rls_coverage.py

      # Skips on SQLite/unset DATABASE_URL; fails when a Postgres deployment would
      # connect as SUPERUSER/BYPASSRLS, which makes every RLS policy inert.
      - name: RLS runtime role guard (SEC-65)
        run: PYTHONPATH=backend python scripts/ci/check_rls_runtime_role.py

      # Enumerates tenant tables from pg_attribute, so it also sees tables that have
      # no ORM model (invisible to the metadata ratchet above) and per-tenant schema
      # copies. Skips on SQLite/unset DATABASE_URL.
      - name: RLS live-schema audit (SEC-65)
        run: PYTHONPATH=backend python scripts/audit/check_rls_live_schema.py

      # Разд. 63.3: выключенный модуль не должен оставаться доступным по прямому
      # вызову API. Гард требует backend-гейт у каждого модуля каталога и падает,
      # если между модулями появились зависимости (риск «эскалация через
      # зависимости» надо обработать осознанно, а не унаследовать молчанием).
      - name: Module entitlements guard (SEC-63)
        run: PYTHONPATH=backend python scripts/ci/check_module_gates.py

      # Разд. 64.2: антивирус — обязательный gate, а не опция. На CI APP_ENV не
      # production, поэтому шаг проверяет саму логику гарда на продовом наборе
      # переменных: конфигурация без AV_ENABLED должна отвергаться.
      - name: AV gate is mandatory in prod-like config (SEC-64)
        run: |
          set -e
          PYTHONPATH=backend python scripts/ci/check_av_gate.py
          APP_ENV=production AV_ENABLED=true CLAMAV_HOST=clamav \
            PYTHONPATH=backend python scripts/ci/check_av_gate.py
          if APP_ENV=production AV_ENABLED=false \
              PYTHONPATH=backend python scripts/ci/check_av_gate.py; then
            echo "check_av_gate.py не отверг конфигурацию с выключенным антивирусом" >&2
            exit 1
          fi

      - name: Ruff undefined names + staged mypy (tenant guard)
        run: bash scripts/ci/static_gates.sh

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    needs: [changes, security-exceptions]
    # На PR и в еженедельном прогоне — да; на повторном прогоне main — нет:
    # зависимости те же, что проверялись час назад. Ratchet-гейт semgrep
    # (sast-static-analysis) при этом остаётся на КАЖДОМ прогоне: он дешёвый и
    # закрывает разд. 69.
    if: needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Render Trivy ignore file from security exceptions
        run: python scripts/ci/render_trivyignore.py --exceptions-file .github/security-exceptions.yml --output .trivyignore.generated

      - name: Dependency vulnerability gate (High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.generated
          format: table
          exit-code: 1

      # Разд. 64.1 «Vulnerable Components: Trivy + pip-audit + npm audit в CI».
      # Trivy смотрит на дерево зависимостей по файлам-манифестам, pip-audit — по
      # базе PyPI advisories; они пересекаются не полностью, поэтому ТЗ называет оба.
      #
      # BLOCKING (2026-07-30, шаг 4 из docs/security/DEPENDENCY_AUDIT.md): база
      # находок вычищена подъёмом зависимостей (multipart/dotenv/click+typer,
      # 2026-07-31 — fastapi 0.141/starlette 1.3.1); осознанный остаток (ecdsa без
      # апстрим-фикса, dev-only pytest/black) принят записями ``tool: pip-audit``
      # в .github/security-exceptions.yml — их валидирует (и валит по сроку)
      # job security-exceptions, а сюда они попадают как --ignore-vuln через
      # render_pip_audit_ignores.py. Новая advisory без записи = красный CI.
      - name: pip-audit gate (Python advisories)
        run: |
          python -m pip install --quiet pip-audit
          IGNORES="$(python scripts/ci/render_pip_audit_ignores.py)"
          echo "pip-audit ignores (из security-exceptions.yml): ${IGNORES:-<пусто>}"
          set -o pipefail
          status=0
          # || status=$? — дефолтный bash -e иначе оборвёт шаг до записи summary.
          pip-audit --requirement requirements.txt --requirement requirements-dev.txt \
            ${IGNORES} | tee pip-audit.txt || status=$?
          {
            echo "### pip-audit (blocking gate)"
            echo '```'
            tail -40 pip-audit.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # BLOCKING (2026-07-31, финал шага 4 из docs/security/DEPENDENCY_AUDIT.md):
      # runtime-зависимости вычищены `npm audit fix`; остаток — 6 корневых
      # advisory в dev-инструментах (vitest/vite/minimatch/brace-expansion),
      # принят записями ``tool: npm-audit`` в security-exceptions.yml. У npm
      # audit нет ignore-механизма, поэтому гейт — check_npm_audit.py: валит
      # сборку за любую НЕ принятую high/critical первопричину (GHSA), а не за
      # раздутый список транзитивно помеченных пакетов.
      - name: npm audit gate (frontend advisories)
        run: |
          status=0
          # || — сам npm audit при находках выходит ненулевым; вердикт выносит
          # check_npm_audit.py по JSON и security-exceptions.yml.
          npm --prefix frontend audit --json > npm-audit.json || true
          python scripts/ci/check_npm_audit.py --audit-json npm-audit.json || status=$?
          {
            echo "### npm audit gate"
            echo '```'
            npm --prefix frontend audit --audit-level=high | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  secret-scan:
    runs-on: ubuntu-latest
    needs: security-exceptions
    # gitleaks-action@v2 needs to read the PR commit range AND post a summary
    # comment; the default GITHUB_TOKEN scope (contents: read, metadata: read,
    # packages: read) returns "Resource not accessible by integration" on the
    # PR endpoint. Grant the minimum extra scope explicitly.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        # gitleaks-action@v2 runs ``gitleaks detect --log-opts='... <base>^..<head>'``
        # on pull_request events; with the default shallow checkout
        # (``fetch-depth: 1``) the parent of <base> is unreachable and gitleaks
        # exits with ``failed to scan Git repository error="stderr is not empty"``.
        # Full history is required for the diff-based scan to walk commits.
        with:
          fetch-depth: 0

      - name: Secret scanning gate
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN for PR-scoped scans
          # (breaking change announced 2024-05).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
          # NOTE: previously had ``--no-git`` here, but gitleaks-action@v2 invokes
          # ``gitleaks detect`` on pull_request events (which is git-mode by
          # design); --no-git triggers ``failed to scan Git repository
          # error="stderr is not empty"``. The action's own logic picks the
          # right mode based on the event — keep EXTRA_ARGS to formatting flags
          # only.
          GITLEAKS_EXTRA_ARGS: --redact --verbose

  sast-static-analysis:
    runs-on: ubuntu-latest
    needs: security-exceptions
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна semgrep --baseline-commit (ratchet-диф ниже).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Bandit SAST gate (High severity / High confidence)
        run: |
          mkdir -p artifacts/security
          bandit -r backend/app -lll -iii -f json -o artifacts/security/bandit-high.json

      # Дополнение №3 к ТЗ, разд. 69: semgrep ловит паттерны (XXE/injection),
      # которые Trivy (зависимости) и bandit-High могут пропустить.
      # BLOCKING как ratchet-гейт: через --baseline-commit блокируем ТОЛЬКО НОВЫЕ
      # ERROR-находки относительно базы (PR-base / previous-push / HEAD~1);
      # пред-существующие находки сборку не валят — по конвенции ратчет-гейтов
      # репозитория (ср. coverage-climb). Базлайн локально не измерялся (semgrep
      # не идёт нативно на Windows, Docker недоступен) — поэтому diff-режим,
      # безопасный по построению вне зависимости от объёма старых находок.
      - name: Semgrep pattern SAST (Доп. №3 разд. 69 — ratchet-gate на новые ERROR)
        run: |
          mkdir -p artifacts/security
          python -m pip install --quiet semgrep
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify --quiet HEAD~1 || true)"
          fi
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Semgrep ratchet: база=$BASE — блокируем только НОВЫЕ ERROR-находки"
            semgrep scan --config p/python --config p/owasp-top-ten \
              --severity ERROR --baseline-commit "$BASE" --error \
              --json --output artifacts/security/semgrep.json backend/app
          else
            echo "База не определена (первый коммит / dispatch) — observe-скан без блокировки"
            semgrep scan --config p/python --config p/owasp-top-ten \
              --severity ERROR --json --output artifacts/security/semgrep.json backend/app || true
          fi

      - name: Upload Semgrep report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: artifacts/security/semgrep.json
          if-no-files-found: ignore

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit-report
          path: artifacts/security/bandit-high.json

  container-image-scan:
    runs-on: ubuntu-latest
    needs: [changes, security-exceptions]
    if: needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency for Trivy ignore rendering
        run: python -m pip install --upgrade pip && python -m pip install pyyaml

      - name: Render Trivy ignore file from security exceptions
        run: python scripts/ci/render_trivyignore.py --exceptions-file .github/security-exceptions.yml --output .trivyignore.generated

      - name: Build API image for scanning
        run: docker build -f Dockerfile -t ptd-api:ci .

      - name: Container image vulnerability gate (High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ptd-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.generated
          format: table
          exit-code: 1

  sbom-generation:
    runs-on: ubuntu-latest
    needs: [changes, security-exceptions]
    if: needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for SBOM
        run: docker build -f Dockerfile -t ptd-api:sbom .

      - name: Prepare artifacts directory
        run: mkdir -p artifacts/security

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ptd-api:sbom
          format: cyclonedx-json
          output-file: artifacts/security/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/security/sbom.cdx.json

  # Полный прогон миграций на PostgreSQL (asyncpg); ловит ошибки, которые SQLite/heads не видят.
  alembic-postgres-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ptd
          POSTGRES_PASSWORD: ptd
          POSTGRES_DB: ptd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptd -d ptd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+asyncpg://ptd:ptd@localhost:5432/ptd
      REDIS_URL: memory://
      REDIS_RESULT_URL: memory://
      RATE_LIMIT_STORAGE_URI: memory://
      SECRET_KEY: ci-alembic-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic upgrade head on PostgreSQL
        run: alembic -c backend/app/migrations/alembic.ini upgrade head

      - name: Alembic upgrade head again (idempotency)
        run: alembic -c backend/app/migrations/alembic.ini upgrade head

  backend-tests:
    runs-on: ubuntu-latest
    needs: changes
    # 9 осколков = 111 оплачиваемых минут, 69 % стоимости всего прогона.
    # На push в main их НЕ гоняем: то же дерево только что прошло эти же тесты
    # в прогоне PR, и вторая оплата ничего не проверяет заново.
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.full == 'true'
    # ШАРДЫ: единый прогон 5100+ тестов с branch-coverage копит память по ходу
    # (SQLAlchemy/приложение на каждый тест) и убивает 16-ГБ раннер на ~60-75
    # минуте («runner lost communication … starves it for CPU/Memory») — при
    # любом числе xdist-воркеров. Три осколка (~1300-2000 тестов) держат
    # пик памяти низким; покрытие склеивает job backend-coverage-gate.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Осколки ~500-2000 тестов (~7-10 минут): инфраструктура hosted-раннеров
      # периодически шлёт shutdown-волны, и джобы длиннее ~15-20 минут в них
      # попадают; короткие успевают финишировать между волнами.
      matrix:
        include:
          - shard: backend-unit
            targets: backend/tests integration_tests
          - shard: api-ae
            targets: tests/api/test_[a-e]*.py
          - shard: api-fm
            targets: tests/api/test_[f-m]*.py
          - shard: api-np
            targets: tests/api/test_[n-p]*.py
          - shard: api-qz
            targets: tests/api/test_[q-z]*.py
          - shard: dirs-ae
            targets: tests/contract tests/domains tests/e2e tests/headers tests/integration tests/minio tests/pdf tests/services tests/unit tests/utils tests/test_[a-e]*.py
          - shard: fk-lo
            targets: tests/test_[f-o]*.py
          - shard: pr
            targets: tests/test_[p-r]*.py
          - shard: sz
            targets: tests/test_[s-z]*.py
    services:
      # Включает @pytest.mark.db: keystone enum-label guard + enum write-smoke.
      # Гарды сами создают/дропают throwaway-БД enum_*<uuid> через TEST_PG_ADMIN_URL;
      # `cabinet` не затрагивается. Имена throwaway-БД уникальны (uuid) → совместимо
      # с `-n auto` (xdist).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ptd
          POSTGRES_PASSWORD: ptd
          POSTGRES_DB: ptd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptd"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      REDIS_URL: memory://
      REDIS_RESULT_URL: cache+memory://
      RATE_LIMIT_STORAGE_URI: memory://
      S3_ENDPOINT: http://localhost
      # ptd — суперюзер образа postgres → может CREATE/DROP DATABASE для throwaway.
      # DATABASE_URL НЕ задаём глобально: остальные тесты остаются на SQLite.
      TEST_PG_ADMIN_URL: postgresql://ptd:ptd@localhost:5432/ptd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      # LibreOffice здесь НЕ ставится намеренно. Тесты его не запускают:
      # tests/conftest.py подменяет LIBREOFFICE_BIN на интерпретатор Python,
      # а сам вызов конвертации мокается. Установка занимала полторы-две
      # минуты В КАЖДОМ из девяти осколков — около пятнадцати оплачиваемых
      # минут за прогон за пакет, которым никто не пользуется. Настоящая
      # конвертация проверяется в smoke-compose, где поднимается сервис.

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DB_URL: sqlite:///./ci-alembic.db
        run: alembic -c backend/app/migrations/alembic.ini heads

      - name: Backend test shard (${{ matrix.shard }})
        # --durations=25 — наблюдаемость: имена самых медленных тестов в логе.
        # --cov-report= (пусто) — отчёты не нужны: сырой .coverage уходит в
        # backend-coverage-gate, который склеивает осколки и гоняет гейты.
        run: |
          mkdir -p artifacts
          pytest ${{ matrix.targets }} \
            -n auto \
            --timeout=300 \
            --durations=25 \
            -rfE --tb=short \
            --junitxml=artifacts/backend-junit-${{ matrix.shard }}.xml \
            --cov=backend/app \
            --cov-branch \
            --cov-report=
          mv .coverage artifacts/.coverage.${{ matrix.shard }}

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            artifacts/backend-junit-${{ matrix.shard }}.xml
            artifacts/.coverage.${{ matrix.shard }}

  backend-coverage-gate:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests]
    # Гейт склеивает покрытие ВСЕХ осколков. Без них он не просто бесполезен —
    # он покажет провал покрытия там, где тесты не запускались, то есть соврёт.
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install --upgrade pip coverage

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          merge-multiple: true
          path: artifacts

      - name: Combine shards and build reports
        run: |
          coverage combine artifacts/.coverage.*
          coverage xml -o artifacts/coverage.xml
          coverage json -o artifacts/coverage.json
          coverage report -m > artifacts/coverage-term-missing.txt

      - name: Enforce backend coverage baseline
        run: python scripts/ci/check_backend_coverage_baseline.py --coverage-json artifacts/coverage.json --baseline docs/stabilization/backend_coverage_baseline.json

      - name: Scoped coverage climb gate (core/domain/services)
        # TZ-6.3-V11-01 — ratchet floor + 85% North-Star tracker. See
        # docs/stabilization/coverage_climb_plan.md. Floors bootstrap on first run.
        run: python scripts/ci/check_scoped_coverage.py --coverage-json artifacts/coverage.json --baseline docs/stabilization/scoped_coverage_baseline.json

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            artifacts/backend-junit-*.xml
            artifacts/coverage.xml
            artifacts/coverage.json
            artifacts/coverage-term-missing.txt

  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Contract suite (docs/openapi.yaml + marked tests)
        env:
          APP_ENV: test
          LIBREOFFICE_BIN: python
        run: pytest tests/contract -m contract -v

  frontend-tests:
    runs-on: ubuntu-latest
    needs: changes
    # Та же причина, что у бэкенда: на push в main дерево уже проверено.
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend CI checks
        run: npm --prefix frontend run ci

      - name: Frontend critical coverage gate
        run: npm --prefix frontend run test:coverage:critical

  smoke-compose:
    runs-on: ubuntu-latest
    needs: changes
    # Поднимает весь compose: гоняем, когда задет бэкенд или инфраструктура.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Prepare env
        run: cp .env.example .env

      - name: Fill required CI secrets (placeholders only)
        # .env.example намеренно оставляет секреты пустыми (SEC-67), а bootstrap
        # отвергает пустые SECRET_KEY / S3_* — без этого шага api-контейнер не
        # стартует. APP_DB_PASSWORD обязателен с SEC-65: initdb создаёт
        # непривилегированную роль ptd_app только при заданном пароле, иначе
        # api падает на "password authentication failed for user ptd_app".
        run: |
          cat >> .env <<'EOF'
          SECRET_KEY=ci-smoke-compose-not-for-production
          POSTGRES_PASSWORD=ptd
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          APP_DB_PASSWORD=ci-ptd-app-not-for-production
          ADMIN_BOOTSTRAP=1
          ADMIN_PASSWORD=CiSmokeAdmin123!
          ADMIN_TENANT=demo
          EOF
          # DATABASE_URL в .env.example содержит пароль-заглушку CHANGE_ME —
          # роль же создаётся initdb с APP_DB_PASSWORD; синхронизируем.
          sed -i 's|ptd_app:CHANGE_ME|ptd_app:ci-ptd-app-not-for-production|' .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Smoke checks
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > smoke-logs.txt

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v


  perf-smoke:
    runs-on: ubuntu-latest
    needs: changes
    # ТОЛЬКО в полном прогоне. Задание помечено `continue-on-error` ниже, то
    # есть НИЧЕГО не охраняет — но стоило 5 оплачиваемых минут на каждом
    # прогоне. Платить за сигнал, который не может остановить merge, незачем;
    # производительность и так живёт по local-evidence политике (RB-002).
    if: >-
      needs.changes.outputs.full == 'true'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    # Advisory, not blocking. Throughput/p95 thresholds are flaky on shared
    # GitHub runners (postgres + api + load generator on one host): the app
    # boots and serves (/health 200 @ 184 rps), but a 2nd-burst throughput dip
    # + intermittent 500s under contention is a runner-contention artifact, not
    # an app regression. RB-002 perf is governed by the local-evidence policy
    # (docs/stabilization/RELEASE_BLOCKERS_STATUS.md), not CI. Keep the signal,
    # don't gate the pipeline on it; real perf work is a dedicated RB-002 pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Fill required CI secrets (placeholders only)
        # Staging-hardening (backend/app/core/config.py::bootstrap) rejects empty
        # SECRET_KEY / S3_ACCESS_KEY / S3_SECRET_KEY. .env.example ships them
        # blank by design — fill with CI-only placeholders so API can boot.
        # RB-002f: also seed admin-bootstrap env so dev_bootstrap creates the
        # demo admin user; otherwise perf-smoke calls to /api/v1/dashboard/summary
        # 401 because there is no user/token to authenticate.
        # Rate limit also disabled: login is rate-limited (5/min per identity)
        # and api_load.py _hit_flow re-logins per worker. Without this,
        # perf-smoke 60-request batch would 429 after 5 successes.
        run: |
          cat >> .env <<'EOF'
          SECRET_KEY=ci-perf-smoke-not-for-production
          POSTGRES_PASSWORD=ptd
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          APP_DB_PASSWORD=ci-ptd-app-not-for-production
          APP_ENV=development
          ADMIN_BOOTSTRAP=1
          ADMIN_PASSWORD=PerfSmokeAdmin123!
          ADMIN_TENANT=demo
          RATE_LIMIT_ENABLED=false
          EOF
          # DATABASE_URL в .env.example содержит пароль-заглушку CHANGE_ME —
          # роль же создаётся initdb с APP_DB_PASSWORD; синхронизируем.
          sed -i 's|ptd_app:CHANGE_ME|ptd_app:ci-ptd-app-not-for-production|' .env

      - name: Enable Redis memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Build and up
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API ready after ${i} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready within 600s"
          docker compose logs --tail=200 api
          exit 1

      - name: Perf smoke gate (deterministic profiles)
        run: |
          mkdir -p artifacts/perf
          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /health \
            --requests 80 \
            --concurrency 16 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 30 \
            --max-p95-ms 250 \
            --max-p99-ms 600 \
            --output-json artifacts/perf/health-smoke.json

          # Пороги перекалиброваны 07.08.2026 по фактическим замерам на
          # 2-ядерном hosted-раннере (дашборд: 11.9 rps, p95 1.8s чистых [200]):
          # прежние значения (15 rps / p95 600ms) писались до того, как каждый
          # запрос оброс RLS-armed сессией, billing/deprecation middleware и
          # аудит-цепочкой. Запас ~30-40% — функция «ловить регрессию»
          # сохраняется; философия та же, что у полов покрытия (ratchet).
          # Профили меряют ЦЕЛЕВЫЕ эндпоинты: логин — один раз через
          # --login-email (ровно так задуман api_load, см. комментарий у флага).
          # Прежний flow-json логинился на КАЖДОЙ итерации × 12 воркеров, а
          # аудит-запись логина идёт в хеш-цепочку под глобальным advisory-lock —
          # логины сериализуются по замыслу SEC, и профиль структурно не мог
          # пройти пороги (p50 4.4s, 500-ки от гонки last_login_at — та гонка
          # починена отдельно core-UPDATE'ом в auth.py).
          # templates/search до этого шли вовсе БЕЗ auth и после ужесточения
          # (auth_required) получали 401 — профили никогда не добегали.
          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/dashboard/summary \
            --login-email admin@example.com \
            --login-password 'PerfSmokeAdmin123!' \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 8 \
            --max-p95-ms 2500 \
            --max-p99-ms 3000 \
            --output-json artifacts/perf/dashboard-smoke.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path /api/v1/templates \
            --login-email admin@example.com \
            --login-password 'PerfSmokeAdmin123!' \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 8 \
            --max-p95-ms 6000 \
            --max-p99-ms 6500 \
            --output-json artifacts/perf/templates-smoke.json

          python scripts/perf/api_load.py \
            --base-url http://localhost:8000 \
            --path '/api/v1/search/suggest?q=doc' \
            --login-email admin@example.com \
            --login-password 'PerfSmokeAdmin123!' \
            --tenant demo \
            --requests 60 \
            --concurrency 12 \
            --expect-status 200 \
            --max-error-rate 0.02 \
            --min-throughput 10 \
            --max-p95-ms 2000 \
            --max-p99-ms 2500 \
            --output-json artifacts/perf/search-smoke.json

      - name: Upload perf smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-report
          path: artifacts/perf/*.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 > perf-smoke-logs.txt

      - name: Upload perf logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-logs
          path: perf-smoke-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v
