name: Restore Drill

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REDIS_URL: memory://
      REDIS_RESULT_URL: memory://
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run restore drill
        run: python scripts/restore_drill.py --output-dir artifacts/restore-drill

      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-evidence
          path: artifacts/restore-drill/
