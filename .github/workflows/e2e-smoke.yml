# Ручной запуск: полный smoke требует бэкенд для логина (E2E_USER_*).
# Без секретов выполняются только тесты с preview (страница логина + редирект).
# Расписание: еженедельный прогон (ветка default); при необходимости задайте secrets в форке.
name: E2E smoke (Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke (Playwright starts build + preview)
        env:
          E2E_START_SERVER: "1"
        run: npm run e2e
