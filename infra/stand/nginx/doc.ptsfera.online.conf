# Тестовый стенд prt_ot_doc на doc.ptsfera.online. См. docs/RUNBOOK_TEST_STAND.md.
# Ставится в /etc/nginx/sites-available/, включается симлинком в sites-enabled/.
#
# Витрина — собранная статика (frontend/dist), отдаёт сам nginx.
# Двигатель — FastAPI на 127.0.0.1:8000, сюда уходит всё, что начинается с /api.
#
# Это состояние ДО выпуска сертификата. Certbot допишет блоки HTTPS (443) и
# редирект с 80 — после этого файл нельзя перезаписывать целиком, только точечно
# править (иначе дописанное certbot пропадёт и HTTPS отвалится).

server {
    listen 80;
    listen [::]:80;
    server_name doc.ptsfera.online;

    # Realm ТОЛЬКО ЛАТИНИЦЕЙ: по RFC 7230/7235 в значении заголовка допустим
    # лишь ASCII. С кириллицей Chrome и Яндекс.Браузер молча отказываются
    # показать окно пароля — сайт просто не открывается, хотя curl и внешние
    # проверялки исправно получают 401 и всё выглядит здоровым.
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/.htpasswd-stand;

    # MAX_UPLOAD_SIZE=20971520 в .env.production (20 МБ) + запас.
    client_max_body_size 25m;

    # Робот Let's Encrypt должен приходить без пароля, иначе сертификат
    # не выпустится и не продлится через 3 месяца.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # --- Двигатель ---
    # auth_basic off здесь ОБЯЗАТЕЛЕН. Приложение кладёт токен в заголовок
    # Authorization, а браузер держит там же пропуск basic-auth — карман один,
    # и токен вытесняет пропуск. Симптом: первый вход через окно nginx проходит,
    # форма логина открывается, но после отправки логина окно nginx появляется
    # снова и войти невозможно. Двигатель защищён своей авторизацией.
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Сборка PDF через LibreOffice бывает долгой.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Витрина ---
    # nginx работает от www-data и должен пройти в /home/aiproc. Домашний каталог
    # обычно drwxr-x---, поэтому нужен `sudo chmod o+x /home/aiproc` (право прохода
    # без листинга). Пакета acl на сервере нет, setfacl недоступен.
    root /home/aiproc/projects/prt_ot_doc/frontend/dist;
    index index.html;

    # Файлы с отпечатком в имени (assets/*.a1b2c3.js) не меняются никогда —
    # разрешаем браузеру держать их у себя долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Приложение рисует страницы само, поэтому любой неизвестный адрес надо
    # отдавать index.html, а не 404 — иначе перезагрузка страницы ломается.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
